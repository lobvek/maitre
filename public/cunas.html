<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de QR · Maitre</title>
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/figtree-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#646B41">
<link rel="stylesheet" href="/css/base.css">
<style>
  .sheet-page { max-width: 900px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 7px 14px; border-radius: 100px; border: 0; background: transparent; font: 600 13.5px var(--sans); cursor: pointer; color: var(--ink-2); }
  .tabs button.on { background: var(--ink); color: #fff; }
  .tabs button { transition: background var(--t-fast) var(--ease-micro), color var(--t-fast) var(--ease-micro); }
  .tabs button:hover:not(.on) { background: var(--surface-2); color: var(--ink); }

  /* Hoja de QR provisional: tarjetas recortables para empezar hoy mismo */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .qcard {
    border: 1px dashed #bbb; border-radius: 10px; background: #fff; padding: 16px 12px;
    text-align: center; break-inside: avoid; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .qcard .logo { max-height: 30px; max-width: 100px; object-fit: contain; }
  .qcard .brandname { font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .qcard .n { font-family: var(--serif); font-size: 30px; line-height: 1; font-weight: 600; }
  .qcard svg { width: 118px; height: 118px; }
  .qcard .cta { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #666; }

  /* Vista previa de la cuña: las tres caras */
  .wedges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .wedge { border: 1px dashed var(--line); border-radius: 10px; background: #fff; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; break-inside: avoid; }
  .face { padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; min-height: 190px; }
  .face + .face { border-left: 1px dashed var(--line); }
  .face .logo { max-height: 34px; max-width: 110px; object-fit: contain; }
  .face .brandname { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .face .n { font-family: var(--serif); font-size: 34px; line-height: 1; font-weight: 600; }
  .face svg { width: 108px; height: 108px; }
  .face .cta { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #666; }
  .face .story { font-size: 10.5px; color: #555; line-height: 1.5; }
  .face .reservado { font-family: var(--serif); font-size: 20px; letter-spacing: .18em; text-transform: uppercase; }
  .modulos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .modulo { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; text-align: center; font-size: 13px; }
  .modulo span { display: block; margin-bottom: 8px; color: var(--brand); }
  .modulo span .i { width: 22px; height: 22px; }

  @media print {
    .toolbar, .noprint { display: none !important; }
    body { background: #fff; }
    .sheet-page { padding: 0; max-width: none; }
    @page { size: A4; margin: 12mm; }
  }
</style>
</head>
<body>
<div class="sheet-page">
  <div class="toolbar">
    <a class="btn sm" href="/panel#/mesas">← Volver</a>
    <h1 style="font-size:19px;margin:0" class="grow" id="titulo">Hoja de QR</h1>
    <div class="tabs">
      <button data-tab="qr" class="on">Hoja de QR</button>
      <button data-tab="cuna">Cómo será tu cuña</button>
    </div>
    <button class="btn primary sm" onclick="print()">Imprimir</button>
  </div>
  <div id="aviso" class="notice noprint" style="margin-bottom:18px"></div>
  <div id="out"></div>
</div>
<script type="module">
import { api, esc, $, $$, icon, loader } from '/js/core.js';
import { transicion, haptic } from '/js/motion.js';

$('#out').innerHTML = loader();
const d = await api('/api/tables/print');
const v = d.venue;
document.title = `Hoja de QR · ${v.name}`;
let tab = 'qr';

const story = 'Esta pieza es de roble recuperado de toneles de vino. Cada veta cuenta de dónde viene; el número de lote permite seguir su origen.';

const MODULOS = [
  ['note', 'Servilletero'],
  ['flame', 'Cubrecenicero protegido del viento'],
  ['wheat', 'Sobres de azúcar'],
  ['coffee', 'Aro para taza de espresso'],
];

const hojaQr = () => `<div class="cards">${d.tables.map((t) => `
  <div class="qcard">
    ${v.logo_path ? `<img class="logo" src="${esc(v.logo_path)}" alt="">` : `<div class="brandname">${esc(v.name)}</div>`}
    <div class="n">${esc(t.name)}</div>
    ${t.svg}
    <div class="cta">Escanea para ver la carta</div>
    <div class="mono" style="font-size:9px;color:#999">${esc(t.qr_code)}</div>
  </div>`).join('')}</div>`;

const vistaCuna = () => `
  <div class="wedges">${d.tables.slice(0, 4).map((t) => `
    <div class="wedge">
      <div class="face">
        ${v.logo_path ? `<img class="logo" src="${esc(v.logo_path)}" alt="">` : `<div class="brandname">${esc(v.name)}</div>`}
        <div class="n">${esc(t.name)}</div>
        ${t.svg}
        <div class="cta">Escanea para ver la carta</div>
      </div>
      <div class="face">
        ${Number(t.name) % 2
          ? `<div class="story"><strong>Roble con historia</strong><br>${story}<br>
             <span class="mono">Lote ${esc(t.lot || 'MTR')} · ${esc(t.qr_code)}</span></div>`
          : `<div class="reservado">Reservado</div>`}
      </div>
    </div>`).join('')}
  </div>
  <div class="noprint">
    <h2 style="margin-top:28px">Módulos que se deslizan en la base</h2>
    <p class="muted" style="font-size:13.5px">La misma cuña sirve para un bar de tapas o para una cafetería de especialidad:
    cambia el módulo, no la pieza. Los grabados y el acabado se personalizan con tu marca.</p>
    <div class="modulos stagger">${MODULOS.map(([i, n]) => `<div class="modulo"><span>${icon(i)}</span>${n}</div>`).join('')}</div>
    <div class="notice info" style="margin-top:18px">Estamos preparando los <strong>renders de cada diseño y módulo</strong>
    para que puedas verlos antes de pedirlos. Aparecerán aquí mismo.</div>
  </div>`;

const AVISO = {
  qr: `Esta hoja es <strong>provisional, para empezar hoy mismo</strong>: recorta las tarjetas y ponlas en las mesas
       mientras te preparamos las cuñas de madera. Los QR son los definitivos, así que no habrá que cambiarlos.`,
  cuna: `Así queda tu cuña. <strong>La fabricamos nosotros</strong> con tu logo grabado a láser y te la llevamos al local;
         no tienes que producir nada. Tarda unos días desde que la pides — por eso mientras tanto usas la hoja de QR.
         El QR grabado lleva un código permanente: si cambia el dominio, la mesa o incluso el local, se reasigna desde el panel
         sin regrabar la madera. Cada pieza lleva su lote.`,
};

function paint() {
  $('#titulo').textContent = tab === 'qr' ? 'Hoja de QR' : 'Cómo será tu cuña';
  $('#aviso').innerHTML = AVISO[tab];
  $('#out').innerHTML = tab === 'qr' ? hojaQr() : vistaCuna();
}
$$('.tabs button').forEach((b) => b.onclick = () => {
  if (b.classList.contains('on')) return;
  haptic(8);
  transicion(() => {
    $$('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    tab = b.dataset.tab;
    paint();
  });
});
paint();
</script>
</body>
</html>
