<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<meta name="robots" content="noindex">
<title>Carta</title>
<link rel="stylesheet" href="/css/base.css">
<style>
  body { background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
  .m-head {
    position: sticky; top: 0; z-index: 30; background: var(--surface);
    border-bottom: 1px solid var(--line); padding: 12px 16px 0;
  }
  .m-top { display: flex; align-items: center; gap: 12px; }
  .m-logo { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex: none; }
  .m-logo.letter { display: grid; place-items: center; font-family: var(--serif); font-size: 20px; color: var(--brand); background: var(--brand-soft); }
  .m-name { font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.15; }
  .m-table { font-size: 12.5px; color: var(--ink-3); }
  .m-tools { display: flex; gap: 8px; padding: 10px 0; }
  .m-search { flex: 1; padding: 9px 12px; font-size: 15px; border-radius: 100px; background: var(--surface-2); border-color: transparent; }
  .m-cats { display: flex; gap: 7px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
  .m-cats::-webkit-scrollbar { display: none; }
  .m-cat {
    flex: none; padding: 7px 14px; border-radius: 100px; background: var(--surface-2); border: 1px solid transparent;
    font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .m-cat.on { background: var(--ink); color: #fff; }

  main { padding: 8px 16px 120px; max-width: 640px; margin: 0 auto; }
  .cat-title { font-family: var(--serif); font-size: 1.25rem; margin: 26px 0 4px; scroll-margin-top: 132px; }
  .cat-desc { font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }

  .dish {
    display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line-2);
    cursor: pointer; align-items: flex-start;
  }
  .dish:active { opacity: .6; }
  .dish-body { flex: 1; min-width: 0; }
  .dish-name { font-weight: 600; font-size: 15.5px; margin-bottom: 2px; }
  .dish-desc { font-size: 13.5px; color: var(--ink-3); line-height: 1.45; }
  .dish-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
  .dish-price { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .dish-img { width: 76px; height: 76px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); }
  .dish.out { opacity: .45; }
  .alg { font-size: 13px; letter-spacing: 1px; }
  .badge-qty { background: var(--brand); color: #fff; border-radius: 100px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; padding: 0 6px; }

  /* Barra inferior */
  .m-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); display: flex; gap: 10px;
  }
  .m-bar .btn { flex: 1; }

  /* Hoja inferior */
  .sheet-bg { position: fixed; inset: 0; background: rgba(28,26,23,.45); z-index: 100; display: flex; align-items: flex-end; animation: fade .2s; }
  .sheet {
    background: var(--surface); width: 100%; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0;
    padding: 0 0 calc(16px + env(safe-area-inset-bottom)); animation: up .26s cubic-bezier(.2,.8,.3,1);
    max-width: 640px; margin: 0 auto;
  }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet-head { position: sticky; top: 0; background: var(--surface); padding: 16px 18px 10px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line-2); }
  .sheet-body { padding: 16px 18px; }
  .sheet-foot { position: sticky; bottom: 0; background: var(--surface); padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-2); font-size: 14.5px; }
  .opt input { flex: none; }
  .qty { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
  .qty button { width: 32px; height: 32px; border: 0; background: transparent; font-size: 18px; cursor: pointer; border-radius: 50%; color: var(--ink); }
  .qty button:hover { background: var(--surface-2); }
  .qty span { min-width: 22px; text-align: center; font-weight: 600; }

  .line { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line-2); align-items: flex-start; }
  .track { display: flex; gap: 6px; margin: 12px 0; }
  .track div { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
  .track div.on { background: var(--green); }
  .callbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; }
  .callbtn span { font-size: 22px; }
  .callbtn:active { background: var(--surface-2); }
  footer { padding: 26px 18px 30px; text-align: center; }
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:80px"><div class="spin" style="margin:0 auto 14px"></div>Cargando la carta…</div></div>
<script type="module" src="/js/menu.js"></script>
</body>
</html>
