<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Maitre</title>
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/figtree-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#646B41">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { display: flex; min-height: 100vh; background: var(--cream); }
  nav.side { width: 244px; flex: none; background: var(--paper); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 9px; }
  .brand img { width: 118px; align-self: flex-start; }
  .brand .venue { font-family: var(--display); font-size: 16px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
  .side .links { flex: 1; overflow-y: auto; padding: 4px 11px; }
  .side a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--r-sm);
    color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500; margin-bottom: 2px;
    transition: background var(--t-fast) var(--ease), color var(--t-fast); }
  .side a .i { width: 18px; height: 18px; color: var(--ink-3); transition: color var(--t-fast); }
  .side a:hover { background: var(--g-50); color: var(--ink); }
  .side a:hover .i { color: var(--ink-2); }
  .side a.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .side a.on .i { color: var(--brand-ink); }
  .side a.on .tag { background: rgba(255,255,255,.2); color: var(--brand-ink); }
  .side footer { padding: 15px; border-top: 1px solid var(--line); font-size: 13px; }
  .side footer .who strong { display: block; font-size: 13.5px; }
  .side footer .who span { color: var(--ink-3); font-size: 12px; word-break: break-all; }

  main.app { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 13px; padding: 15px 28px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--cream) 88%, transparent); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
  .topbar h2 { margin: 0; font-size: 1.28rem; }
  .view { padding: 28px; max-width: 1200px; }
  .view > * { animation: enter .34s var(--ease-out) both; }
  .burger { display: none; }
  @media (max-width: 880px) {
    body { display: block; }
    nav.side { position: fixed; z-index: 60; transform: translateX(-100%); transition: transform var(--t) var(--ease); box-shadow: var(--sh-3); }
    nav.side.open { transform: none; }
    .burger { display: inline-flex; }
    .view { padding: 18px 16px; }
    .topbar { padding: 12px 16px; }
  }
</style>
</head>
<body>
<nav class="side" id="side">
  <div class="brand"><img src="/assets/logotipo.png" alt="Maitre"><span class="venue" id="venue-name">—</span></div>
  <div id="group-switch" class="hidden" style="padding:0 14px 10px;display:grid;gap:5px"></div>
  <div class="links" id="links"></div>
  <footer>
    <div id="who" class="who"></div>
    <div class="row" style="margin-top:8px">
      <a class="btn sm grow" href="/sala">Sala</a>
      <button class="btn sm" id="logout">Salir</button>
    </div>
    <a class="btn sm block" id="ayuda" href="#" target="_blank" rel="noopener" style="margin-top:8px">Ayuda por WhatsApp</a>
  </footer>
</nav>
<main class="app">
  <div class="topbar">
    <button class="btn sm burger" id="burger"><svg class="i " aria-hidden="true"><use href="/assets/icons.svg#i-burger"/></svg></button>
    <h2 id="title" style="margin:0;font-size:1.15rem">Panel</h2>
    <span class="grow"></span>
    <span id="plan-chip"></span>
  </div>
  <div class="view" id="view"></div>
</main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
