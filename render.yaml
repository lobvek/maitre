# Blueprint de Maitre. En render.com: New → Blueprint → conectar este repo → Apply.
#
# Este es el despliegue de DEMOSTRACIÓN: gratis, para enseñar Maitre sin coste.
# Trae los dos locales de muestra, y además tu propia cuenta de operador.
#
# No sirve para un bar de verdad: el plan Free no tiene disco, así que la carta,
# las mesas y los pedidos se pierden en cada reinicio; y el servicio se duerme a
# los 15 minutos sin visitas, así que el primer escaneo del QR tarda casi un minuto.
# Cuando un bar entre en el piloto, se cambia este fichero por render-pilot.yaml.
services:
  - type: web
    name: maitre-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # node:sqlite solo está disponible sin flag desde Node 23.4. Con el Node por
      # defecto de Render el servidor no arrancaría.
      - key: NODE_VERSION
        value: "24"
      - key: SEED_ON_EMPTY
        value: "1"
      - key: MAITRE_DATA_DIR
        value: /opt/render/project/data
      # Además de los locales de muestra, crea tu propia cuenta de operador para
      # que no tengas que entrar con la contraseña pública de la demo.
      - key: MAITRE_ADMIN_EMAIL
        sync: false
      - key: MAITRE_ADMIN_PASSWORD
        sync: false
      - key: MAITRE_ADMIN_NAME
        sync: false
      - key: PUBLIC_URL
        fromService:
          type: web
          name: maitre-demo
          envVarKey: RENDER_EXTERNAL_URL
