# Render Blueprint de Maitre.
# En render.com: New → Blueprint → conectar este repo → Apply.
#
# Este fichero describe el despliegue REAL, el de la prueba piloto: instancia de pago
# con disco propio, sin datos de muestra y con la cuenta de operador que tú elijas.
#
# ¿Por qué no el plan Free? Porque no tiene disco: cada reinicio borraría la carta,
# las mesas y los pedidos del bar. Y porque se duerme a los 15 minutos sin visitas,
# así que el primer cliente que escanease el QR esperaría casi un minuto a que
# despertase. Para un bar de verdad, ninguna de las dos cosas vale.
services:
  - type: web
    name: maitre
    runtime: node
    plan: starter            # 7 $/mes. El disco se factura aparte (~0,25 $/GB).
    region: frankfurt        # el más cercano a Barcelona
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    # La base de datos, las imágenes de la carta y las claves de las notificaciones
    # viven aquí. Sin este disco se pierden en cada despliegue.
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # node:sqlite solo está disponible sin flag desde Node 23.4. Con el Node por
      # defecto de Render el servidor no arrancaría.
      - key: NODE_VERSION
        value: "24"
      - key: MAITRE_DATA_DIR
        value: /var/data
      # Cuenta de operador que se crea la primera vez. Se piden al aplicar el blueprint.
      - key: MAITRE_ADMIN_EMAIL
        sync: false
      - key: MAITRE_ADMIN_PASSWORD
        sync: false
      - key: MAITRE_ADMIN_NAME
        sync: false
      # Token del bot de Telegram, si se usa el aviso por Telegram. Puede quedarse vacío.
      - key: MAITRE_TELEGRAM_BOT_TOKEN
        sync: false
      # URL pública con la que se generan los QR: la pone Render sola.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: maitre
          envVarKey: RENDER_EXTERNAL_URL
