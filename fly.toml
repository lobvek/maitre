# Fly.io: una máquina pequeña con un volumen persistente para SQLite y las fotos.
app = "maitre"
primary_region = "mad"

[build]

[env]
  NODE_ENV = "production"
  MAITRE_DATA_DIR = "/data"
  PORT = "3000"
  SEED_ON_EMPTY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "maitre_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
